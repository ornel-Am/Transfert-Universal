name: Build and Release

on:
push:
tags:
- 'v*'
release:
types: [published]
workflow_dispatch:

env:
FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
HOMEBREW_NO_REQUIRE_TAP_TRUST: 1

jobs:
build:
name: Build on ${{ matrix.os }}
runs-on: ${{ matrix.os }}
strategy:
fail-fast: false
matrix:
include:
- os: ubuntu-latest
output_name: transfert
artifact_name: Transfert-linux
appimage: true
- os: windows-latest
output_name: transfert.exe
artifact_name: Transfert-windows
- os: macos-15
output_name: transfert
artifact_name: Transfert-macos

steps:
- name: Checkout code
uses: actions/checkout@v4

- name: Setup Python
uses: actions/setup-python@v5
with:
python-version: '3.10'

- name: Install dependencies (Linux)
if: runner.os == 'Linux'
    run: |
    sudo apt-get update
    sudo apt-get install -y python3-tk xvfb wget fuse libfuse2
    pip install pyinstaller pillow
    
    - name: Install dependencies (Windows)
    if: runner.os == 'Windows'
        run: |
        pip install pyinstaller pillow
        
        - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
            run: |
            brew install python-tk
            pip install pyinstaller pillow
            
            - name: Build with PyInstaller (Linux)
            if: runner.os == 'Linux'
                run: |
                cd src
                pyinstaller --onefile --windowed --name transfert main.py
                cd ..
                ls -la src/dist/
                
                - name: Build with PyInstaller (Windows)
                if: runner.os == 'Windows'
                    run: |
                    cd src
                    pyinstaller --onefile --windowed --name transfert.exe main.py
                    cd ..
                    dir src\dist
                    
                    - name: Build with PyInstaller (macOS)
                    if: runner.os == 'macOS'
                        run: |
                        cd src
                        pyinstaller --onefile --windowed --name transfert main.py
                        cd ..
                        ls -la src/dist/
                        
                        - name: Create AppImage (Linux)
                        if: runner.os == 'Linux' && matrix.appimage
                            run: |
                            mkdir -p AppDir/usr/bin
                            cp src/dist/transfert AppDir/usr/bin/
                            
                            cat > AppDir/transfert.desktop << 'DESKTOP'
                            [Desktop Entry]
                            Name=Transfert TCP
                            Comment=Transfert de fichiers TCP
                            Exec=transfert
                            Icon=transfert
                            Terminal=false
                            Type=Application
                            Categories=Network;
                            DESKTOP
                            
                            cat > AppDir/AppRun << 'APPRUN'
                            #!/bin/bash
                            HERE="$(dirname "$(readlink -f "$0")")"
                            exec "$HERE/usr/bin/transfert" "$@"
                            APPRUN
                            chmod +x AppDir/AppRun
                            
                            # Télécharger appimagetool et l'exécuter avec --appimage-extract-and-run
                            wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
                            chmod +x appimagetool-x86_64.AppImage
                            
                            # Utiliser --appimage-extract-and-run pour éviter le problème FUSE
                            ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir Transfert-${{ github.ref_name }}-x86_64.AppImage
                            
                            - name: Upload artifacts
                            uses: actions/upload-artifact@v4
                            with:
                            name: ${{ matrix.artifact_name }}
                            path: |
                            src/dist/${{ matrix.output_name }}
                            Transfert-*.AppImage
                            if-no-files-found: error
                                
                                - name: Upload to Release
                                if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
                                    uses: softprops/action-gh-release@v1
                                    with:
                                    files: |
                                    src/dist/${{ matrix.output_name }}
                                    Transfert-*.AppImage
                                    generate_release_notes: true
